<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>ROX GLOBAL Exchange Center</title>
 <meta name="description" content="ROX GLOBAL Exchange Center item prices, listing amounts, and daily history.">
 <link rel="icon" type="image/png" href="./exchange-center.png"><link rel="stylesheet" href="./app.css">
</head>
<body>
 <header><div class="brand"><img src="./exchange-center.png" alt=""><strong>ROX GLOBAL Exchange Center</strong></div><span id="updated"></span></header>
 <main>
  <aside><nav id="groups" aria-label="Exchange groups"></nav><nav id="categories" aria-label="Item categories"></nav><nav id="subcategories" aria-label="Item subcategories"></nav></aside>
  <section class="catalog"><div class="heading"><div><h1 id="heading">All items</h1><p>Browse items and their daily market history.</p></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search item name…" aria-label="Search item name"></label></div>
   <div id="grid" class="grid"></div><div id="empty" class="empty hidden">No items in this category.</div>
  </section>
 </main>
 <dialog id="detail"><button id="close" class="close" aria-label="Close">×</button><div class="detail-head"><div class="large-icon"><img id="icon" alt=""><span id="icon-missing" class="hidden">?</span></div><div><p id="category"></p><h2 id="name"></h2></div></div>
  <section class="metrics"><div><span>Latest price</span><b id="price">—</b></div><div><span>Standard price</span><b id="standard">—</b></div><div><span>Lowest listing</span><b id="lowest">—</b></div><div><span>Highest listing</span><b id="highest">—</b></div><div><span>Amount listed</span><b id="amount">—</b></div></section>
  <div class="chart-head"><h3>Daily history</h3><select id="metric" aria-label="History type"><option value="prices">All prices</option><option value="standard">Standard price</option><option value="lowest">Lowest price</option><option value="highest">Highest price</option><option value="amount">Amount listed</option></select></div>
  <div class="legend" id="legend"></div><div class="chart"><canvas id="chart" aria-label="Daily price history"></canvas><span id="chart-empty" class="chart-empty hidden"></span></div>
  <div class="table-wrap"><table><thead><tr><th>Date</th><th>Standard</th><th>Lowest</th><th>Highest</th><th>Amount</th></tr></thead><tbody id="days"></tbody></table></div>
 </dialog>
 <footer><span>ROX GLOBAL Exchange Center</span></footer>
 <script type="module" src="./app.mjs"></script>
</body></html>
